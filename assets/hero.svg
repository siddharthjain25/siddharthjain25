<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #181825; stroke: #313244; stroke-width: 2; }
    .bar { fill: #11111b; }
    .title { font: 700 38px 'JetBrains Mono', 'Fira Code', monospace; fill: url(#mocha-grad); }
    .sub { font: 500 15px 'JetBrains Mono', 'Fira Code', monospace; fill: #bac2de; }
    .prompt { font: 600 14px 'JetBrains Mono', 'Fira Code', monospace; fill: #a6e3a1; }
    .cmd { font: 400 14px 'JetBrains Mono', 'Fira Code', monospace; fill: #cdd6f4; }
    .pill-bg { fill: #313244; }
    .pill-txt { font: 600 12px 'JetBrains Mono', monospace; fill: #cba6f7; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { fill: #f5c2e7; animation: blink 1.1s infinite; }
  </style>
  <defs>
    <linearGradient id="mocha-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cba6f7" />
      <stop offset="50%" stop-color="#89b4fa" />
      <stop offset="100%" stop-color="#94e2d5" />
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="218" rx="14" class="bg"/>
  <path d="M1 15C1 7.26801 7.26801 1 15 1H885C892.732 1 899 7.26801 899 15V36H1V15Z" class="bar"/>

  <!-- Catppuccin Window Controls -->
  <circle cx="24" cy="18" r="6" fill="#f38ba8"/>
  <circle cx="44" cy="18" r="6" fill="#f9e2af"/>
  <circle cx="64" cy="18" r="6" fill="#a6e3a1"/>
  <text x="450" y="23" text-anchor="middle" font-family="monospace" font-size="12" fill="#6c7086">siddharth@mocha: ~/profile</text>

  <!-- Terminal Prompt -->
  <text x="36" y="72" class="prompt">❯</text>
  <text x="54" y="72" class="cmd">whoami --verbose</text>

  <!-- Name & Role -->
  <text x="36" y="122" class="title">Siddharth Jain</text>
  <text x="36" y="152" class="sub">Backend &amp; Integration Engineer · Distributed Systems · Local-First AI</text>

  <!-- Status Pills -->
  <rect x="36" y="172" width="128" height="26" rx="6" class="pill-bg"/>
  <text x="100" y="189" text-anchor="middle" class="pill-txt">📍 Pune, India</text>

  <rect x="176" y="172" width="150" height="26" rx="6" class="pill-bg"/>
  <text x="251" y="189" text-anchor="middle" class="pill-txt" style="fill:#89b4fa">☁️ AWS &amp; Azure</text>

  <rect x="338" y="172" width="172" height="26" rx="6" class="pill-bg"/>
  <text x="424" y="189" text-anchor="middle" class="pill-txt" style="fill:#a6e3a1">🐧 Arch / Fedora</text>

  <rect x="522" y="176" width="9" height="18" rx="1" class="cursor"/>
</svg>
